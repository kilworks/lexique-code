<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Learn the code lexicon: words that change how code gets written and how an agent works, in English and French." />
    <title>Code lexicon</title>
    <script>
      // Apply a forced theme before first paint to avoid a flash (same key as src/lib/storage.ts).
      try {
        var t = JSON.parse(localStorage.getItem('lexicon.theme.v1'));
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
